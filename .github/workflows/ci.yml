name: RESQ.AI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: resq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resq_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d resq_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resq_ai
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resq_ai_test
      APP_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests (creates its own test database)
        run: python -m pytest ../testing -q

      - name: Compile Python sources
        run: python -m compileall -q app

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, type-check and build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Check translation files have identical keys
        working-directory: frontend/src/locales
        run: |
          python - <<'PY'
          import json
          def keys(d, p=""):
              out = set()
              for k, v in d.items():
                  out |= keys(v, p + k + ".") if isinstance(v, dict) else {p + k}
              return out
          en = keys(json.load(open("en.json")))
          for l in ("te", "ta", "hi"):
              k = keys(json.load(open(f"{l}.json")))
              assert k == en, (l, sorted(en ^ k))
          print("locales ok")
          PY

  firmware:
    name: ESP32 firmware build and host logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build ESP32 firmware
        working-directory: iot
        run: cp include/secrets.example.h include/secrets.h && pio run

      - name: Compile host hazard logic tests
        working-directory: iot
        run: >-
          g++ -std=c++17 -Wall -Wextra -I include
          src/hazard_detector.cpp test/host/hazard_detector_test.cpp
          -o "$RUNNER_TEMP/hazard_detector_test"

      - name: Run host hazard logic tests
        run: "$RUNNER_TEMP/hazard_detector_test"

      - name: Compile and run persistent alert queue tests
        working-directory: iot
        run: g++ -std=c++17 -Wall -Wextra -I include test/host/alert_store_test.cpp -o "$RUNNER_TEMP/alert_store_test" && "$RUNNER_TEMP/alert_store_test"
