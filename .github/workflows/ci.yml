name: RESQ.AI CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resq_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d resq_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resq_ai
      APP_ENV: test
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3:4b

    defaults:
      run:
        working-directory: emergency-intelligence-response-main/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: emergency-intelligence-response-main/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Seed demonstration data
        run: python -m app.db.seed_demo_data

      - name: Run backend tests
        run: python -m pytest ../testing/test_backend.py -q

      - name: Compile Python sources
        run: python -m compileall -q backend app

  frontend-syntax:
    name: Frontend syntax checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        working-directory: resq.ai_emergency_response_platform
        run: node --check app.js

      - name: Check platform server syntax
        working-directory: resq.ai_emergency_response_platform
        run: python -m py_compile server.py
